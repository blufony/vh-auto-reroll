buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '5.1.+'  
}

apply plugin: 'org.spongepowered.mixin'

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup "curse.maven" }
    }
}

version = '1.0.0'
group = 'dev.blufony.autoreroll'

base {
    archivesName = 'auto_reroll'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add sourceSets.main, "autoreroll-refmap.json"
    config "autoreroll.mixins.json"
}

minecraft {
    mappings channel: 'official', version: '1.18.2'
    
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            
            mods {
                autoreroll {
                    source sourceSets.main
                }
            }
        }
        
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            
            mods {
                autoreroll {
                    source sourceSets.main
                }
            }
        }
    }
}



dependencies {
    minecraft 'net.minecraftforge:forge:1.18.2-40.2.0'
    
    implementation fg.deobf("curse.maven:vault-hunters-official-mod-458203:7952001")
    implementation fg.deobf("curse.maven:vault-filters-952507:7318439")
    implementation fg.deobf("curse.maven:create-328085:4835188")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
